  constraints:
    - "Create or use branch gs-i6-verified-webhook-ingress and create exactly one implementation commit with subject feat: add verified GitHub webhook ingress and exact parent 71af3d1967175d5f44127de8259535854ba19c13; do not amend, rebase, squash, or add a correction commit in this pass."
